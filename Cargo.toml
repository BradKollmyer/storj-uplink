[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/storj/storj-rust"

[workspace.dependencies]
storj = { path = "crates/storj" }
storj-access = { path = "crates/storj-access" }
storj-proto = { path = "crates/storj-proto" }
storj-rpc = { path = "crates/storj-rpc" }
storj-test = { path = "crates/storj-test" }
storj-uplink = { path = "crates/storj-uplink" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
bytes = "1"
prost = "0.13"
prost-types = "0.13"
thiserror = "2"
zstd = "0.13"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
x509-parser = "0.16"

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
