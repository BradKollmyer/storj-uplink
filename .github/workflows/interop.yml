name: interop

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly storj-sim walkthrough (heavy; not part of default PR CI).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Grant parse/serialize/share vs Go uplink. No satellite.
  # The 1.0 object matrix (including 64MiB+1) needs a live satellite and is
  # skipped here; run it with STORJ_INTEROP=1 + STORJ_INTEROP_ACCESS / STORJ_SIM_ACCESS.
  grant-roundtrip:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: scripts/interop/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Go helper parse/serialize fixture
        run: |
          grant=$(tr -d '\n' < crates/storj/tests/fixtures/grant_go.txt)
          go run -C scripts/interop . parse "$grant"
          go run -C scripts/interop . serialize "$grant" >/tmp/grant-roundtrip.txt
          test -s /tmp/grant-roundtrip.txt
      - name: Grant/share interop tests
        env:
          STORJ_INTEROP: "1"
        run: >
          cargo test -p storj --test interop -- --ignored
          --skip writer_reader_size_matrix

  # Nightly / manual only. Does not fail default PR CI when sim is unavailable.
  # STORJ_SIM_ACCESS is a repository secret: it is available on schedule and
  # workflow_dispatch, never on pull_request (including forks).
  # 64MiB+1 is part of the 1.0 Go↔Rust size matrix when a satellite is available:
  #   STORJ_INTEROP=1 STORJ_INTEROP_ACCESS=... cargo test -p storj --test interop \
  #     writer_reader_size_matrix -- --ignored
  sim:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: scripts/interop/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: storj-sim instructions
        run: |
          cat <<'EOF'
          storj-sim is heavy (Postgres, Go) and is not brought up in this job.
          https://github.com/storj/storj/wiki/Test-network

          Local walkthrough:
            storj-sim network setup && storj-sim network run
            export STORJ_SIM=1
            export STORJ_SIM_ACCESS="$(storj-sim network env GATEWAY_0_ACCESS)"
            cargo test -p storj --test sim -- --ignored

          To run this job against a live network, set the STORJ_SIM_ACCESS
          repository secret (serialized grant from GATEWAY_0_ACCESS) and
          dispatch this workflow.
          EOF
      - name: Walkthrough if STORJ_SIM_ACCESS secret is present
        env:
          STORJ_SIM: "1"
          STORJ_SIM_ACCESS: ${{ secrets.STORJ_SIM_ACCESS }}
        run: |
          if [ -z "$STORJ_SIM_ACCESS" ]; then
            echo "STORJ_SIM_ACCESS secret is not set; skipping walkthrough."
            exit 0
          fi
          cargo test --locked -p storj --test sim -- --ignored
      - name: Go↔Rust object size matrix (incl. 64MiB+1) if secret is present
        env:
          STORJ_INTEROP: "1"
          STORJ_INTEROP_ACCESS: ${{ secrets.STORJ_SIM_ACCESS }}
        run: |
          if [ -z "$STORJ_INTEROP_ACCESS" ]; then
            echo "STORJ_SIM_ACCESS secret is not set; skipping object matrix."
            exit 0
          fi
          cargo test --locked -p storj --test interop writer_reader_size_matrix -- --ignored --nocapture
