name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --workspace --locked

  # MSRV per README (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: check on MSRV
        run: cargo check --workspace --all-targets --locked

  # Mitigation 3 / R1: fail if vendored proto drifts from the pin without a PR.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: checksum vendored protos against pin
        run: bash proto/check-pin.sh
      - name: checked-in prost matches protos
        run: |
          bash proto/gen-prost.sh
          cargo fmt --all
          # `git status` also catches newly generated (untracked) files that
          # `git diff` would miss.
          if [ -n "$(git status --porcelain crates/storj-proto/src/gen)" ]; then
            git status --porcelain crates/storj-proto/src/gen
            git diff crates/storj-proto/src/gen
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny check

  # Go generator vs checked-in fixtures (Argon2 p=1/p=8, path HMAC, grant, RS).
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: dtolnay/rust-toolchain@stable
      - name: generate goldens
        run: go run -C scripts .
      - name: fixtures are not stale
        run: git diff --exit-code crates/storj/tests/fixtures/
      - name: kdf, path HMAC, grant, and RS goldens match Go
        run: >
          cargo test --locked -p storj --test encryption_kdf --test encryption_golden
          --test grant_golden --test ec_golden
      - name: storj-ec goldens match infectious
        run: cargo test --locked -p storj-ec --test golden
