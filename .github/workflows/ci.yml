name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: compile all tests including ignored
        run: cargo test --workspace --no-run

  # Mitigation 3 / R1: fail if vendored proto drifts from the pin without a PR.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: checksum vendored protos against pin
        run: bash proto/check-pin.sh
      - name: checked-in prost matches protos
        run: |
          bash proto/gen-prost.sh
          cargo fmt --all
          git diff --exit-code crates/storj-proto/src/gen

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny check

  # Go generator vs checked-in fixtures (Argon2 p=1/p=8, path HMAC, grant).
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: dtolnay/rust-toolchain@stable
      - name: generate goldens
        run: go run -C scripts .
      - name: fixtures are not stale
        run: git diff --exit-code crates/storj/tests/fixtures/derive_root_key.jsonl crates/storj/tests/fixtures/path_hmac.jsonl crates/storj/tests/fixtures/grant_go.txt
      - name: kdf, path HMAC, and grant goldens match Go
        run: cargo test -p storj --test encryption_kdf --test encryption_golden --test grant_golden
