name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: compile all tests including ignored
        run: cargo test --workspace --no-run

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checksum vendored protos against pin
        run: bash proto/check-pin.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny check

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - name: generate goldens
        run: go run -C scripts .
      - name: fixtures are not stale
        run: git diff --exit-code crates/storj/tests/fixtures/derive_root_key.jsonl crates/storj/tests/fixtures/path_hmac.jsonl
      - name: kdf and path HMAC match Go
        run: cargo test -p storj --test encryption_kdf --test encryption_golden
