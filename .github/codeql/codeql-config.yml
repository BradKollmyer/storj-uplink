name: storj-uplink
# Integration tests and goldens pin Go vectors with fixed passphrases/keys/nonces.
# Trailing `#[cfg(test)] mod` blocks are stripped from the SARIF by
# `filter-test-alerts.py`.
#
# `rust/hard-coded-cryptographic-value` is excluded: this crate is an encryption
# client. Remaining hits are Go-compat protocol zeros (`storj.Nonce{}` / metadata
# and ETag nonces; uniqueness is the random content key) and CSPRNG scratch
# buffers overwritten before use. Test goldens must keep fixed keys.
paths-ignore:
  - "crates/storj/tests/**"
  - "crates/*/tests/**"
  - "fuzz/**"
  - "scripts/**"
  - "crates/storj-proto/src/gen/**"
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value

