name: storj-uplink
# Integration tests and goldens pin Go vectors with fixed passphrases/keys/nonces.
# `filter-test-alerts.py` strips trailing `#[cfg(test)] mod` blocks and two
# documented production false positives (`ZERO_NONCE`, `csprng_bytes`). The
# `rust/hard-coded-cryptographic-value` query itself stays enabled.
paths-ignore:
  - "crates/storj/tests/**"
  - "crates/*/tests/**"
  - "fuzz/**"
  - "scripts/**"
  - "crates/storj-proto/src/gen/**"

