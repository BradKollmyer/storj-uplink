# cargo-deny: licenses, advisories, bans, sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = [
    # `instant` is pulled in only by `reed-solomon-erasure`, a dev-dependency
    # of storj-ec used for a divergence test against infectious; never shipped.
    { id = "RUSTSEC-2024-0384", reason = "dev-only via reed-solomon-erasure divergence test" },
]

[licenses]
confidence-threshold = 0.8
# Permissive licenses we accept as deps appear; unused today is expected.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# `storj-test` is path-only (`publish = false`). Other workspace crates carry
# `version` so they can be published. cargo-deny treats version-less path deps
# as wildcards, so warn instead.
wildcards = "warn"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
